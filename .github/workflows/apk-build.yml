name: Build WordWise Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Extract Updated Project ZIP
      - name: Extract Project ZIP
        run: |
          unzip -o WordWiseOffline-Android-Project-Fixed.zip -d extracted

      # Step 4: Find Gradle Project
      - name: Locate Gradle Project
        id: project
        run: |
          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"

      # Step 5: Build Debug APK
      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace

      # Step 6: Upload APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WordWise-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
